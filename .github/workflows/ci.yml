name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A new push to the same PR supersedes its previous build. Cancelling stale
# runs avoids spending runners and compiler-cache bandwidth on obsolete code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI uses sccache rather than Cargo's machine-local incremental artifacts.
  # This keeps cache keys portable across ephemeral runners and shrinks the
  # target directories managed by rust-cache.
  CARGO_INCREMENTAL: 0
  # crates/render's GpuRenderer/Canvas2D (and anything that spawns a real
  # profile-worker, which renders through them - profile/automation/shell's
  # own tests) need a real wgpu adapter to open. GitHub's ubuntu runners
  # have no physical GPU, so `mesa-vulkan-drivers` below installs Mesa's
  # lavapipe - a real (software) Vulkan implementation - giving
  # wgpu::Backends::PRIMARY a genuine adapter to enumerate instead of
  # failing outright.
  WGPU_BACKEND: vulkan

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets

  build:
    name: Build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # crates/js-runtime/quickjs-sys vendors QuickJS-ng as a real git
          # submodule (crates/js-runtime/quickjs-sys/vendor/quickjs-ng) -
          # required for that crate's build.rs to have C sources to
          # compile at all. `recursive` also picks up quickjs-ng's own
          # `test262` submodule declaration, but that one is configured
          # `update = none` in its .gitmodules, so it's skipped the same
          # way a local `git submodule update --init --recursive` skips
          # it - not fetched, not needed to build this workspace.
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-render0-dev libxcb-shm0-dev libxcb1-dev \
            libgl1-mesa-dri libegl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build workspace
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --workspace --verbose

      - name: Report compiler-cache statistics
        if: always()
        run: sccache --show-stats

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Run unit tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: make unit

      - name: Report compiler-cache statistics
        if: always()
        run: sccache --show-stats

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-render0-dev libxcb-shm0-dev libxcb1-dev \
            libgl1-mesa-dri libegl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      # `xvfb-run` gives every test process a real (virtual, headless) X11
      # display - needed by anything that talks to a real OS display/
      # clipboard (platform-apis's clipboard tests, and transitively
      # apps/shell's own eframe-adjacent tests), the same way this
      # engine's own test suite already assumes a real display exists
      # rather than mocking one out. Real profile-worker-spawning tests
      # (profile/automation/shell) get their GPU adapter from lavapipe
      # (see WGPU_BACKEND above), not from Xvfb - Vulkan doesn't need an
      # X11 display, just a loadable ICD. Verified locally (mesa-vulkan-
      # drivers + xvfb-run): every real GPU test in crates/render, and
      # every real profile-worker-spawning test, genuinely passes this
      # way - this isn't a guess.
      #
      # One real, narrow skip: `write_text_then_read_text_round_trips_
      # through_the_real_os_clipboard` (crates/js-runtime) round-trips a
      # value through the actual OS clipboard - under Xvfb (no window
      # manager, no persistent clipboard owner/manager process) X11
      # clipboard ownership handoff is unreliable enough that even a
      # correct implementation can hang waiting on a selection request
      # that never resolves. Confirmed locally: it hangs under
      # mesa-vulkan-drivers + xvfb-run the same way. Every other
      # clipboard test (Promise shape, argument validation) still runs.
      - name: Run integration tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: xvfb-run -a make integration

      - name: Report compiler-cache statistics
        if: always()
        run: sccache --show-stats

  runtime:
    name: JavaScript runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-render0-dev libxcb-shm0-dev libxcb1-dev \
            libgl1-mesa-dri libegl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Run JavaScript runtime tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: xvfb-run -a make runtime

      - name: Report compiler-cache statistics
        if: always()
        run: sccache --show-stats

  coverage:
    name: Coverage
    # Coverage recompiles the workspace with LLVM instrumentation. Keep it on
    # main and manual runs: PRs run the equivalent build, unit, runtime, and
    # integration gates in parallel without a second full compilation.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb-render0-dev libxcb-shm0-dev libxcb1-dev \
            libgl1-mesa-dri libegl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # cargo-llvm-cov keeps its instrumented build in a separate target
          # directory, so retain both it and the normal Cargo artifacts.
          cache-all-crates: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: >
          xvfb-run -a cargo llvm-cov --workspace --lcov --output-path lcov.info
          -- --skip write_text_then_read_text_round_trips_through_the_real_os_clipboard

      - name: Report compiler-cache statistics
        if: always()
        run: sccache --show-stats

      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      # Real upload to Codecov, using this repo's own codecov.yml (targets
      # explained in that file's header - no 100% target, see its own
      # comment for why). `fail_ci_if_error: false` so a Codecov-side
      # outage doesn't fail an otherwise-green build; the coverage numbers
      # themselves still come from the real `lcov.info` above either way.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
