<!DOCTYPE html>
<meta charset="utf-8">
<title>Atomic</title>
<style>
:root {
  --bg: #131421;
  --panel: #12131f;
  --panel2: #141625;
  --surface: #1a1c2b;
  --text: #e9e9ed;
  --muted: rgba(233, 233, 237, 0.55);
  --muted2: rgba(233, 233, 237, 0.4);
  --accent: #9184d9;
  --accent-200: #b5abfc;
  --accent-800: #3a3468;
  --accent-bg: rgba(145, 132, 217, 0.14);
  --ok: #8fe0b8;
  --warn: #e0c168;
  --err: #e08a9a;
  --border: rgba(233, 233, 237, 0.07);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px system-ui, sans-serif;
}
.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.toolbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-weight: 600;
  color: var(--accent-200);
}
.tabs {
  display: flex;
  gap: 2px;
}
.tab {
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.tab.active {
  color: var(--accent-200);
  background: var(--accent-bg);
}
.tab:not(.active) {
  color: var(--muted);
}
.tab:not(.active):hover {
  background: rgba(233, 233, 237, 0.06);
}
.body {
  display: flex;
  flex: 1;
  min-height: 0;
}
.sidebar {
  width: 56px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
}
.ws-icon {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 500;
}
.ws-icon .badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: var(--accent-800);
  border: 1.5px solid var(--panel);
  color: var(--accent-200);
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.list {
  width: 244px;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--panel2);
  border-right: 1px solid var(--border);
}
.list.collapsed {
  width: 68px;
}
.list-header {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
}
.list-body {
  flex: 1;
  overflow: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.acc-card {
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.acc-card:hover {
  background: rgba(233, 233, 237, 0.05);
}
.acc-row {
  display: flex;
  align-items: center;
  gap: 7px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
}
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel2);
}
.btn {
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
}
.btn-primary {
  background: var(--accent-bg);
  color: var(--accent-200);
  border: 1px solid var(--accent-800);
}
.btn-secondary {
  background: rgba(233, 233, 237, 0.06);
  color: var(--text);
}
.statbar {
  height: 30px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--muted);
}
.grid-toolbar {
  height: 40px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
}
.seg {
  display: flex;
  border: 1px solid rgba(233, 233, 237, 0.12);
  border-radius: 8px;
  overflow: hidden;
}
.seg > div {
  padding: 5px 11px;
  font-size: 12px;
  cursor: pointer;
}
.pane-grid {
  flex: 1;
  min-height: 0;
  padding: 10px;
  display: grid;
  gap: 10px;
}
.pane {
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  overflow: hidden;
  background: #0f1019;
}
.pane-head {
  height: 32px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  background: #15172a;
  font-size: 12px;
}
.pane-body {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1b1c26;
  color: var(--muted2);
  font-size: 11px;
}
.screen {
  height: 100%;
  overflow: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stat-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.card {
  padding: 14px;
  border-radius: 10px;
  background: var(--surface);
}
.card .label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}
.card .value {
  font-size: 26px;
  margin-top: 6px;
}
.card .note {
  font-size: 11.5px;
  color: var(--muted2);
}
.bars {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  margin-top: 14px;
}
.bar {
  flex: 1;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(180deg, var(--accent-200), var(--accent-800));
}
.proc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-top: 1px solid var(--border);
}
.automation-layout {
  height: 100%;
  display: grid;
  grid-template-columns: 280px 1fr;
}
.script-item {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}
.script-item:hover {
  background: rgba(233, 233, 237, 0.05);
}
.code {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12.5px;
  line-height: 1.85;
  padding: 14px 16px;
  overflow: auto;
}
.code-line {
  display: flex;
  gap: 14px;
}
.code-n {
  width: 18px;
  text-align: right;
  color: rgba(233, 233, 237, 0.25);
}
.log {
  border-top: 1px solid var(--border);
  background: #101120;
  padding: 10px 16px;
}
.log-line {
  display: flex;
  gap: 10px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11.5px;
  line-height: 1.9;
}
.dl-list, .settings-nav-wrap {
  border-radius: 10px;
  background: var(--surface);
  overflow: hidden;
}
.dl-row, .hist-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
}
.settings-layout {
  height: 100%;
  display: grid;
  grid-template-columns: 200px 1fr;
}
.settings-nav {
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-right: 1px solid var(--border);
}
.settings-nav-item {
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 12.5px;
  cursor: pointer;
}
.settings-row {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(8, 9, 15, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  width: 520px;
  padding: 22px;
  border-radius: 14px;
  background: var(--surface);
}
.context-menu {
  position: fixed;
  z-index: 50;
  width: 222px;
  padding: 5px;
  border-radius: 10px;
  background: var(--surface);
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 12.5px;
  cursor: pointer;
}
.menu-item:hover {
  background: var(--accent-bg);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 11.5px;
}
.field input {
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid rgba(233, 233, 237, 0.14);
  background: #101120;
  color: var(--text);
}
</style>
<div id="root"></div>
<script src="node_modules/preact/dist/preact.umd.js"></script>
<script src="node_modules/preact/hooks/dist/hooks.umd.js"></script>
<script src="node_modules/htm/dist/htm.umd.js"></script>
<script>
const html = htm.bind(preact.h);

function Toolbar({ state, set }) {
  return html`
    <div class="toolbar">
      <div class="brand">Atomic</div>
      <div class="tabs">
        ${
    TABS.map((tab) =>
      html`
          <div
            class=${"tab" + (state.view === tab.id ? " active" : "")}
            onClick=${() => {
        dispatch({ action: "switchTab", id: tab.id });
        set({ view: tab.id });
      }}
          >${tab.label}</div>
        `
    )
  }
      </div>
    </div>
  `;
}

function Sidebar({ state, set }) {
  return html`
    <div class="sidebar">
      ${
    WS.map((ws) =>
      html`
        <div
          class="ws-icon"
          title=${ws.name}
          style=${{
        color: ws.id === state.activeWorkspace
          ? "var(--accent-200)"
          : "var(--muted)",
        background: ws.id === state.activeWorkspace
          ? "var(--accent-bg)"
          : "transparent",
      }}
          onClick=${() => {
        dispatch({ action: "switchWorkspace", id: ws.id });
        set({ activeWorkspace: ws.id });
      }}
        >
          ${ws.initial}
          <span class="badge">${ws.count}</span>
        </div>
      `
    )
  }

function AccountList({ state, set }) {
  const activeWs = WS.find((w) => w.id === state.activeWorkspace) || WS[0];
  return html`

        <div style="flex:1;font-weight:500">${activeWs.name}</div>

      <div class="list-body">
        ${
    ACC.map((a, i) =>
      html`
          <div
            class="acc-card"
            style=${{
        background: i === state.active ? "var(--accent-bg)" : "transparent",
      }}

        dispatch({ action: "selectAccount", index: i });
        set({ active: i, view: "grid" });
      }}

            <div class="acc-row">

              <div style="flex:1;font-weight:500">${a.name}</div>

        state.listOpen && html`
              <div style="padding-left:14px;font-size:11.5px;color:${

      <div class="pane-grid" style=${{
    gridTemplateColumns: GRID_COLS[state.grid],
    gridTemplateRows: GRID_ROWS[state.grid],

        ${
    panes.map((p, i) =>

const SCREENS = {
  grid: GridScreen,
  monitor: MonitorScreen,
  automation: AutomationScreen,
  downloads: DownloadsScreen,
  settings: SettingsScreen,
  onboarding: OnboardingScreen,
};

function App() {
  const [state, setState] = useState(DEFAULT_STATE);
  const set = (patch) => setState((s) => ({ ...s, ...patch }));
  const Screen = SCREENS[state.view] || GridScreen;

  // Rust -> JS push: replaces (merges into) the whole app state - the
  // same primitive toolbar.html's own bridge already proved.
  window.__atomicBridge = {
    setState(next) {
      setState((s) => ({ ...s, ...next }));
    },
  };

  return html`
    <div class="shell">
      <${Toolbar} state=${state} set=${set} />
      <div class="body">
        <${Sidebar} state=${state} set=${set} />
        <${AccountList} state=${state} set=${set} />
        <div class="main">
          <${Screen} state=${state} set=${set} />
        </div>
      </div>
      <${StatusBar} state=${state} />
      ${state.menu && html`<${ContextMenu} state=${state} set=${set} />`}
      ${state.modal === "add" && html`<${AddProfileModal} set=${set} />`}
    </div>
  `;
}

preact.render(html`<${App} />`, document.getElementById("root"));
</script>
