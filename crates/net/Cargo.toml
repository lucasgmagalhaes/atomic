[package]
name = "net"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "tls12", "ring", "native-tokio", "logging"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net"] }
